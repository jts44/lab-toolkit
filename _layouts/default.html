<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="{{ '/' | relative_url }}#scripts">Scripts</a>
    <a href="{{ '/' | relative_url }}#guides">Guides</a>
    <a href="{{ '/docs/how-to-use.html' | relative_url }}">How to use</a>
  </nav>
</header>
<main class="{% if page.url == '/' %}home{% else %}doc{% endif %}">
{% if page.audience %}<p><span class="badge {{ page.audience }}">{{ site.audiences[page.audience] }}</span></p>{% endif %}
{{ content }}
</main>
<footer class="site">
  <a href="{{ site.repo_url }}">Source on GitHub</a>
  {% if page.path and page.url != '/' %} · <a href="{{ site.repo_url }}/blob/main/{{ page.path }}">Edit this page</a>{% endif %}
</footer>
<script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
